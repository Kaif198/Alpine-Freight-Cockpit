name: Refresh published market data
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - name: Refresh sources, retaining last good files on failure
        id: refresh
        continue-on-error: true
        env:
          SCRAPER_CONTACT: ${{ vars.SCRAPER_CONTACT }}
        run: python scraper/run.py
      - name: Commit changed data and source status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh published market observations"
            git push
          fi
      - name: Signal partial refresh failure
        if: steps.refresh.outcome == 'failure'
        run: exit 1
